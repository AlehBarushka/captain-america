name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Firebase config presence
        env:
          FIREBASE_API_KEY_SET: ${{ vars.FIREBASE_API_KEY != '' || secrets.FIREBASE_API_KEY != '' }}
          FIREBASE_AUTH_DOMAIN_SET: ${{ vars.FIREBASE_AUTH_DOMAIN != '' || secrets.FIREBASE_AUTH_DOMAIN != '' }}
          FIREBASE_PROJECT_ID_SET: ${{ vars.FIREBASE_PROJECT_ID != '' || secrets.FIREBASE_PROJECT_ID != '' }}
          FIREBASE_STORAGE_BUCKET_SET: ${{ vars.FIREBASE_STORAGE_BUCKET != '' || secrets.FIREBASE_STORAGE_BUCKET != '' }}
          FIREBASE_MESSAGING_SENDER_ID_SET: ${{ vars.FIREBASE_MESSAGING_SENDER_ID != '' || secrets.FIREBASE_MESSAGING_SENDER_ID != '' }}
          FIREBASE_APP_ID_SET: ${{ vars.FIREBASE_APP_ID != '' || secrets.FIREBASE_APP_ID != '' }}
        run: |
          missing=0
          for key in \
            FIREBASE_API_KEY \
            FIREBASE_AUTH_DOMAIN \
            FIREBASE_PROJECT_ID \
            FIREBASE_STORAGE_BUCKET \
            FIREBASE_MESSAGING_SENDER_ID \
            FIREBASE_APP_ID
          do
            status_var="${key}_SET"
            if [ "${!status_var}" = "true" ]; then
              echo "$key: SET"
            else
              echo "$key: EMPTY"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            cat <<'EOF'

          Firebase config is empty. Names must match byte-for-byte:
          FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET, FIREBASE_MESSAGING_SENDER_ID, FIREBASE_APP_ID

          This job uses environment: github-pages, so copy the 6 FIREBASE_* variables into
          Settings → Environments → github-pages (plus repo-level Actions secrets/variables).
          EOF
            exit 1
          fi

      - name: Inject Firebase config
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET || secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID || secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID || secrets.FIREBASE_APP_ID }}
        run: python3 scripts/inject-firebase-config.py

      - name: Prepare site
        run: |
          mkdir -p _site/css _site/js _site/icons
          cp index.html manifest.webmanifest sw.js _site/
          cp css/styles.css _site/css/
          cp js/app.js js/firebase-config.js _site/js/
          cp icons/icon-192.png icons/icon-512.png _site/icons/

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
